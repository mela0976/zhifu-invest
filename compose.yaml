name: zhifu-invest

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: zhifu-invest:local
    init: true
    user: node
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4173
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:4173}
      DATA_FILE: /app/runtime/data.json
      DEMO_MODE: ${DEMO_MODE:-true}
      SESSION_SECRET: ${SESSION_SECRET:-}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:-}
      LINE_LOGIN_CHANNEL_SECRET: ${LINE_LOGIN_CHANNEL_SECRET:-}
      LINE_LOGIN_CALLBACK_URL: ${LINE_LOGIN_CALLBACK_URL:-}
      LINE_MESSAGING_ACCESS_TOKEN: ${LINE_MESSAGING_ACCESS_TOKEN:-}
      LINE_MESSAGING_CHANNEL_SECRET: ${LINE_MESSAGING_CHANNEL_SECRET:-}
      LINE_OA_BASIC_ID: ${LINE_OA_BASIC_ID:-}
      LINE_OPERATIONS_USER_ID: ${LINE_OPERATIONS_USER_ID:-}
      LINE_COMPLIANCE_USER_ID: ${LINE_COMPLIANCE_USER_ID:-}
    ports:
      - "127.0.0.1:4173:4173"
    volumes:
      - zhifu-runtime:/app/runtime
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4173/healthz',{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 4s
      start_period: 10s
      retries: 5
    stop_grace_period: 10s

volumes:
  zhifu-runtime:
    name: zhifu-invest-runtime
